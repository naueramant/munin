# Local Screen Configuration
# Copy this file to ~/.munin/screen.yaml on your device
syntax: v1

# Fullscreen tabs to display and cycle through
tabs:
  - url: "https://grafana.internal/d/local-stats"
    duration: 45 # seconds

  - url: "https://weather.com/"
    duration: 15

# Timed page takeovers: interrupt the rotation at a set time for a fixed duration
schedules:
  - when: "12:00"        # Every day at noon
    duration: 900        # Hold for 15 minutes
    message: "Lunch time — back at 12:30"
    font_size: 96
    background_color: "#111111"

# TV Screen Power Scheduling via HDMI CEC (cec-utils) & system operations
power:
  screen_on: "0 7 * * 1-5"   # Turn on Monday to Friday at 07:00
  screen_off: "0 19 * * 1-5" # Standby Monday to Friday at 19:00
  reboot: "0 3 * * *"        # Nightly reboot at 03:00 (auto turns screen back off if off-hours)
  cec_device: 0              # Default CEC target (0 for TV)

