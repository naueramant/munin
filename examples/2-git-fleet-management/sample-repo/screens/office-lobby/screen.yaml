syntax: v1

# Fullscreen tabs to display in reception lobby
tabs:
  - url: "https://welcome.company.com/"
    duration: 30
    reload: true
    css: "custom.css"
  - url: "https://calendar.google.com/calendar/embed?src=company_events"
    duration: 20

# HDMI CEC screen power scheduling
power:
  screen_on: "0 7 * * 1-5"   # Turn on Mon-Fri at 07:00
  screen_off: "0 19 * * 1-5" # Turn off Mon-Fri at 19:00
  cec_device: 0

# Sync shared branding asset to local filesystem
files:
  - src: "../../shared/logo.svg"
    dest: "/home/pi/assets/logo.svg"
    mode: "0644"
