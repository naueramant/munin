syntax: v1

# Fullscreen tabs to display in reception lobby
tabs:
  - url: "https://welcome.company.com/"
    duration: 30
    css: "custom.css"
  - url: "https://calendar.google.com/calendar/embed?src=company_events"
    duration: 20

# Company-wide takeovers (one file per schedule in shared/schedules/)
schedules: !include_dir_merge_list ../../shared/schedules/

# Shared office-hours power schedule
power: !include ../../shared/power/office-hours.yaml

# Sync shared branding asset to local filesystem
files:
  - src: "../../shared/logo.svg"
    dest: "/home/pi/assets/logo.svg"
    mode: "0644"
