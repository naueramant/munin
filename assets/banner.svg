<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E17"/>
      <stop offset="100%" stop-color="#04060A"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 68px; fill: #FFFFFF; letter-spacing: -1.5px; }
    .tagline { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 21px; fill: #94A3B8; }
    .badge-text { font-family: 'SF Mono', Monaco, Menlo, 'Courier New', monospace; font-size: 13px; font-weight: 600; fill: #00E5FF; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="420" fill="url(#bannerBg)" rx="16"/>
  <rect width="1198" height="418" x="1" y="1" rx="15" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Subtle Display Grid Background -->
  <g stroke="#38BDF8" stroke-opacity="0.04" stroke-width="1">
    <path d="M 0 70 H 1200 M 0 140 H 1200 M 0 210 H 1200 M 0 280 H 1200 M 0 350 H 1200"/>
    <path d="M 120 0 V 420 M 240 0 V 420 M 360 0 V 420 M 480 0 V 420 M 600 0 V 420 M 720 0 V 420 M 840 0 V 420 M 960 0 V 420 M 1080 0 V 420"/>
  </g>

  <!-- Ambient Glow Behind Logo -->
  <circle cx="1020" cy="210" r="160" fill="#00E5FF" opacity="0.08" filter="url(#softGlow)"/>

  <!-- Left Content Area -->
  <g transform="translate(90, 95)">
    <!-- Pill Badges -->
    <g transform="translate(0, 0)">
      <rect width="115" height="28" rx="14" fill="#00E5FF" fill-opacity="0.1" stroke="#00E5FF" stroke-opacity="0.3"/>
      <text x="57" y="18.5" text-anchor="middle" class="badge-text">AUTONOMOUS</text>

      <rect x="125" width="85" height="28" rx="14" fill="#38BDF8" fill-opacity="0.1" stroke="#38BDF8" stroke-opacity="0.3"/>
      <text x="167" y="18.5" text-anchor="middle" class="badge-text" fill="#38BDF8">KIOSK OS</text>

      <rect x="220" width="130" height="28" rx="14" fill="#6366F1" fill-opacity="0.1" stroke="#6366F1" stroke-opacity="0.3"/>
      <text x="285" y="18.5" text-anchor="middle" class="badge-text" fill="#A5B4FC">RASPBERRY PI</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="95" class="title">munin<tspan fill="#00E5FF">.</tspan></text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="150" class="tagline">YAML-configurable screen agent &amp; dashboard display manager</text>
    <text x="0" y="182" class="tagline" fill="#64748B" font-size="18px">Engineered for lightweight Linux kiosks, digital signage, and unattended screens.</text>
  </g>

  <!-- Right Graphic: Large Minimalist Munin Monogram / Icon -->
  <g transform="translate(860, 80)">
    <!-- Outer screen frame -->
    <rect x="0" y="0" width="250" height="250" rx="36" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <rect x="10" y="10" width="230" height="230" rx="28" fill="none" stroke="url(#accentGlow)" stroke-width="2" opacity="0.4"/>

    <!-- Geometric Raven Icon -->
    <g filter="url(#softGlow)" transform="translate(-10, -5)">
      <path d="M 65 185 L 135 45 L 185 95 L 115 185 Z" fill="url(#cyanGrad)" opacity="0.95"/>
      <path d="M 135 45 L 210 82 L 170 105 Z" fill="#00E5FF"/>
      <path d="M 100 185 L 155 110 L 195 150 L 130 185 Z" fill="url(#cyanGrad)" opacity="0.5"/>
      <circle cx="155" cy="72" r="6" fill="#FFFFFF"/>
    </g>
    <!-- Screen active dot -->
    <circle cx="222" cy="28" r="5" fill="#10B981" filter="url(#softGlow)"/>
  </g>
</svg>
