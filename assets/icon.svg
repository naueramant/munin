<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#05070D"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#334155" stroke-width="3" stroke-opacity="0.6"/>

  <!-- Subtle Display Grid Overlay -->
  <g stroke="#38BDF8" stroke-opacity="0.07" stroke-width="2">
    <line x1="96" y1="96" x2="416" y2="96"/>
    <line x1="96" y1="176" x2="416" y2="176"/>
    <line x1="96" y1="256" x2="416" y2="256"/>
    <line x1="96" y1="336" x2="416" y2="336"/>
    <line x1="96" y1="416" x2="416" y2="416"/>
    <line x1="96" y1="96" x2="96" y2="416"/>
    <line x1="176" y1="96" x2="176" y2="416"/>
    <line x1="256" y1="96" x2="256" y2="416"/>
    <line x1="336" y1="96" x2="336" y2="416"/>
    <line x1="416" y1="96" x2="416" y2="416"/>
  </g>

  <!-- Kiosk Display Outer Bezel -->
  <rect x="100" y="100" width="312" height="312" rx="28" fill="none" stroke="url(#primaryGlow)" stroke-width="4" opacity="0.3"/>

  <!-- Minimalist Geometric Raven & Screen Core -->
  <g filter="url(#glow)">
    <!-- Raven Wing & Back Silhouette -->
    <path d="M 160 350 L 256 160 L 320 224 L 230 350 Z" fill="url(#primaryGlow)" opacity="0.95"/>

    <!-- Raven Head & Sharp Beak -->
    <path d="M 256 160 L 360 210 L 300 240 Z" fill="#00E5FF"/>
    
    <!-- Secondary Wing Dynamic Layer -->
    <path d="M 210 350 L 285 245 L 340 300 L 250 350 Z" fill="url(#primaryGlow)" opacity="0.6"/>

    <!-- Kiosk / Telemetry Eye Dot -->
    <circle cx="282" cy="198" r="8" fill="#FFFFFF"/>
  </g>

  <!-- Hardware / Agent Status Indicator -->
  <circle cx="380" cy="132" r="6" fill="#10B981" filter="url(#glow)"/>
</svg>
